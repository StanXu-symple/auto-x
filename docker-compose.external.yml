# Use this override when PostgreSQL and Redis are managed outside Docker Compose.
# Compose v2.24+ is required for the !reset tag.
services:
  migrate:
    depends_on: !reset []
    environment:
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}

  auth-center:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always

  backend:
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - article_uploads:/var/lib/xsentinel/article-uploads
      - runtime_logs:/var/log/xsentinel
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  ai-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 256m
        reservations:
          memory: 128m

  qq-worker:
    volumes:
      - article_uploads:/var/lib/xsentinel/article-uploads:ro
      - runtime_logs:/var/log/xsentinel
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256m
        reservations:
          memory: 128m

  xhs-worker:
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - article_uploads:/var/lib/xsentinel/article-uploads:ro
      - xhs_home:/var/lib/xsentinel/xhs-home
      - runtime_logs:/var/log/xsentinel
    environment:
      HOME: /var/lib/xsentinel/xhs-home
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_HOST: ${POSTGRES_HOST:?POSTGRES_HOST must be set}
      POSTGRES_PORT: ${POSTGRES_PORT:?POSTGRES_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
      XHS_BROWSER_POOL_SIZE: ${XHS_BROWSER_POOL_SIZE:-1}
      XHS_BROWSER_MAX_CONCURRENCY: ${XHS_BROWSER_MAX_CONCURRENCY:-1}
    restart: always

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 192m
        reservations:
          memory: 48m
