# Use this override when MySQL and Redis are managed outside Docker Compose.
# Compose v2.24+ is required for the !reset tag.
services:
  migrate:
    depends_on: !reset []
    environment:
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}

  backend:
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - runtime_logs:/var/log/xsentinel
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  ai-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 256m
        reservations:
          memory: 128m

  qq-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256m
        reservations:
          memory: 128m

  xhs-worker:
    environment:
      HOME: /var/lib/xsentinel/xhs-home
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      MYSQL_HOST: ${MYSQL_HOST:?MYSQL_HOST must be set}
      MYSQL_PORT: ${MYSQL_PORT:?MYSQL_PORT must be set}
      REDIS_HOST: ${REDIS_HOST:?REDIS_HOST must be set}
      REDIS_PORT: ${REDIS_PORT:?REDIS_PORT must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD-}
    restart: always

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 192m
        reservations:
          memory: 48m
