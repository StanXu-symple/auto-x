[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "x-sentinel-backend"
version = "1.0.0"
description = "X Sentinel monitoring API and polling worker"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy[asyncio]>=2.0.36,<3.0",
  "aiomysql>=0.2,<1.0",
  "alembic>=1.14,<2.0",
  "redis[hiredis]>=5.2,<7.0",
  "httpx>=0.27,<1.0",
  "pydantic-settings>=2.7,<3.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "cryptography>=44,<47",
  "twscrape>=0.20,<0.21",
  "prometheus-client>=0.21,<1.0",
  "psutil>=6.1,<8.0",
  "python-multipart>=0.0.20,<1.0",
  "nonebot2[fastapi,httpx,websockets]>=2.5,<3.0",
  "nonebot-adapter-qq>=1.7,<2.0",
  "xhs-cli>=0.1.4,<0.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.25,<1.0",
  "respx>=0.22,<1.0",
  "ruff>=0.9,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]
