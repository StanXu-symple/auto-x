services:
  xhs-worker:
    extends:
      file: docker-compose.microservices.yml
      service: xhs-worker

networks:
  control:
    name: ${CONTROL_NETWORK_NAME:-x-sentinel-control}
    external: ${CONTROL_NETWORK_EXTERNAL:-true}
  app:
    name: ${APP_NETWORK_NAME:-x-sentinel_app}
    external: ${APP_NETWORK_EXTERNAL:-true}
  data:
    name: ${DATA_NETWORK_NAME:-x-sentinel_data}
    external: ${DATA_NETWORK_EXTERNAL:-true}
  monitoring:
    name: ${MONITORING_NETWORK_NAME:-x-sentinel_monitoring}
    external: ${MONITORING_NETWORK_EXTERNAL:-true}
