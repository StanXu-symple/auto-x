services:
  migrate:
    environment:
      ENVIRONMENT: development
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    restart: "no"

  postgres:
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_EXPORTER_PASSWORD: ${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 512m
        reservations:
          memory: 128m

  redis:
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-64mb}
      - --maxmemory-policy
      - noeviction
      - --tcp-keepalive
      - "60"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-64mb}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 128m
        reservations:
          memory: 64m

  auth-center:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      SERVICE_AUTH_KEY_ENCRYPTION_KEY: ${SERVICE_AUTH_KEY_ENCRYPTION_KEY:?SERVICE_AUTH_KEY_ENCRYPTION_KEY must be set}
    restart: always

  backend:
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - article_uploads:/var/lib/xsentinel/article-uploads
      - runtime_logs:/var/log/xsentinel
    environment:
      HOME: /var/lib/xsentinel/xhs-home
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      # Shared application secrets and runtime tuning are resolved from Nacos.
      # Data-service values remain a local Compose bootstrap cache.
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "2.00"
          memory: 256m
        reservations:
          memory: 128m

  ai-worker:
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 256m
        reservations:
          memory: 128m


  qq-worker:
    volumes:
      - article_uploads:/var/lib/xsentinel/article-uploads:ro
      - runtime_logs:/var/log/xsentinel
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
    restart: always
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 256m
        reservations:
          memory: 128m

  xhs-worker:
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - article_uploads:/var/lib/xsentinel/article-uploads:ro
      - xhs_home:/var/lib/xsentinel/xhs-home
      - runtime_logs:/var/log/xsentinel
    environment:
      HOME: /var/lib/xsentinel/xhs-home
      ENVIRONMENT: production
      DEBUG: "false"
      STARTUP_STRICT: "true"
      AUTO_CREATE_TABLES: "false"
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?ADMIN_USERNAME must be set}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set}
      XHS_BROWSER_POOL_SIZE: ${XHS_BROWSER_POOL_SIZE:-1}
      XHS_BROWSER_MAX_CONCURRENCY: ${XHS_BROWSER_MAX_CONCURRENCY:-1}
    restart: always

  frontend:
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 192m
        reservations:
          memory: 48m

  postgres-exporter:
    environment:
      DATA_SOURCE_NAME: postgresql://exporter:${POSTGRES_EXPORTER_PASSWORD:?POSTGRES_EXPORTER_PASSWORD must be set}@postgres:5432/${POSTGRES_DATABASE:?POSTGRES_DATABASE must be set}?sslmode=disable
    restart: always

  redis-exporter:
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    restart: always

  node-exporter:
    restart: always

  prometheus:
    restart: always

  grafana:
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:?GRAFANA_ADMIN_USER must be set}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?GRAFANA_ADMIN_PASSWORD must be set}
    restart: always
