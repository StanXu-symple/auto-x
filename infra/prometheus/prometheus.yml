global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    application: x-sentinel

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - prometheus:9090

  - job_name: x-sentinel-api
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - backend:8000
        labels:
          component: api

  - job_name: x-sentinel-worker
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - worker:8001
        labels:
          component: worker

  - job_name: x-sentinel-ai-worker
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - ai-worker:8002
        labels:
          component: ai-worker

  - job_name: x-sentinel-qq-worker
    metrics_path: /metrics
    scrape_interval: 10s
    static_configs:
      - targets:
          - qq-worker:8004
        labels:
          component: qq-worker

  - job_name: x-sentinel-frontend
    metrics_path: /metrics
    static_configs:
      - targets:
          - frontend:80
        labels:
          component: frontend

  - job_name: mysql
    static_configs:
      - targets:
          - mysql-exporter:9104
        labels:
          component: database

  - job_name: redis
    static_configs:
      - targets:
          - redis-exporter:9121
        labels:
          component: cache

  - job_name: node
    static_configs:
      - targets:
          - node-exporter:9100
        labels:
          component: host
