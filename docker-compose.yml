name: x-sentinel

x-logging: &default-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend-common
  build:
    context: ./backend
  image: x-sentinel-backend:${IMAGE_TAG:-latest}
  environment: &backend-environment
    APP_NAME: ${APP_NAME:-X Sentinel}
    ENVIRONMENT: ${ENVIRONMENT:-development}
    DEBUG: ${DEBUG:-false}
    API_PREFIX: /api/v1
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    HOME: /var/lib/xsentinel/xhs-home
    STARTUP_STRICT: ${STARTUP_STRICT:-true}
    AUTO_CREATE_TABLES: ${AUTO_CREATE_TABLES:-true}
    APP_TIMEZONE: ${TZ:-Asia/Shanghai}
    MYSQL_DSN: ${MYSQL_DSN:-}
    MYSQL_HOST: ${MYSQL_HOST:-mysql}
    MYSQL_PORT: ${MYSQL_PORT:-3306}
    MYSQL_DATABASE: ${MYSQL_DATABASE:-xsentinel}
    MYSQL_USER: ${MYSQL_USER:-xsentinel}
    MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
    MYSQL_POOL_SIZE: ${MYSQL_POOL_SIZE:-10}
    MYSQL_MAX_OVERFLOW: ${MYSQL_MAX_OVERFLOW:-20}
    MYSQL_POOL_RECYCLE_SECONDS: ${MYSQL_POOL_RECYCLE_SECONDS:-1800}
    REDIS_HOST: ${REDIS_HOST:-redis}
    REDIS_PORT: ${REDIS_PORT:-6379}
    REDIS_DB: ${REDIS_DB:-0}
    REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    REDIS_SOCKET_TIMEOUT_SECONDS: ${REDIS_SOCKET_TIMEOUT_SECONDS:-3}
    REDIS_URL: ${REDIS_URL:-}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:-development-only-change-me}
    JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
    JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-480}
    ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me-now}
    X_TOKEN_ENCRYPTION_KEY: ${X_TOKEN_ENCRYPTION_KEY:-}
    X_TOKEN_CACHE_TTL_SECONDS: ${X_TOKEN_CACHE_TTL_SECONDS:-300}
    X_API_BASE_URL: ${X_API_BASE_URL:-https://api.x.com/2}
    X_REQUEST_TIMEOUT_SECONDS: ${X_REQUEST_TIMEOUT_SECONDS:-20}
    X_MAX_PAGES_PER_POLL: ${X_MAX_PAGES_PER_POLL:-5}
    X_PAGE_SIZE: ${X_PAGE_SIZE:-100}
    AI_ALLOWED_PROVIDER_HOSTS: '${AI_ALLOWED_PROVIDER_HOSTS:-["api.openai.com"]}'
    AI_WORKER_SCAN_INTERVAL_SECONDS: ${AI_WORKER_SCAN_INTERVAL_SECONDS:-2}
    AI_WORKER_MAX_CONCURRENCY: ${AI_WORKER_MAX_CONCURRENCY:-3}
    AI_WORKER_BATCH_SIZE: ${AI_WORKER_BATCH_SIZE:-50}
    AI_WORKER_LOCK_TTL_SECONDS: ${AI_WORKER_LOCK_TTL_SECONDS:-180}
    AI_WORKER_HEARTBEAT_TTL_SECONDS: ${AI_WORKER_HEARTBEAT_TTL_SECONDS:-30}
    AI_WORKER_METRICS_PORT: "8002"
    QQ_AUTH_URL: ${QQ_AUTH_URL:-https://bots.qq.com/app/getAppAccessToken}
    QQ_API_BASE_URL: ${QQ_API_BASE_URL:-https://api.sgroup.qq.com/}
    QQ_REQUEST_TIMEOUT_SECONDS: ${QQ_REQUEST_TIMEOUT_SECONDS:-20}
    QQ_WORKER_SCAN_INTERVAL_SECONDS: ${QQ_WORKER_SCAN_INTERVAL_SECONDS:-2}
    QQ_WORKER_MAX_CONCURRENCY: ${QQ_WORKER_MAX_CONCURRENCY:-5}
    QQ_WORKER_BATCH_SIZE: ${QQ_WORKER_BATCH_SIZE:-100}
    QQ_WORKER_SEND_INTERVAL_SECONDS: ${QQ_WORKER_SEND_INTERVAL_SECONDS:-5}
    QQ_WORKER_MAX_ATTEMPTS: ${QQ_WORKER_MAX_ATTEMPTS:-3}
    QQ_WORKER_LOCK_TTL_SECONDS: ${QQ_WORKER_LOCK_TTL_SECONDS:-60}
    QQ_WORKER_HEARTBEAT_TTL_SECONDS: ${QQ_WORKER_HEARTBEAT_TTL_SECONDS:-30}
    QQ_WORKER_PORT: "8003"
    QQ_WORKER_METRICS_PORT: "8004"
    DEFAULT_POLL_INTERVAL_SECONDS: ${DEFAULT_POLL_INTERVAL_SECONDS:-300}
    WORKER_SCAN_INTERVAL_SECONDS: ${WORKER_SCAN_INTERVAL_SECONDS:-2}
    WORKER_MAX_CONCURRENCY: ${WORKER_MAX_CONCURRENCY:-5}
    WORKER_BATCH_SIZE: ${WORKER_BATCH_SIZE:-100}
    WORKER_LOCK_TTL_SECONDS: ${WORKER_LOCK_TTL_SECONDS:-120}
    WORKER_HEARTBEAT_TTL_SECONDS: ${WORKER_HEARTBEAT_TTL_SECONDS:-30}
    WORKER_METRICS_PORT: "8001"
    CORS_ORIGINS: '${CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
    PYTHONDONTWRITEBYTECODE: "1"
    PYTHONUNBUFFERED: "1"
  networks:
    - app
    - data
    - monitoring
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *default-logging

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-xsentinel}
      MYSQL_USER: ${MYSQL_USER:-xsentinel}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-change-me-mysql}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me-root}
      MYSQL_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-change-me-exporter}
      MYSQL_INITDB_SKIP_TZINFO: "1"
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./infra/mysql/conf.d/x-sentinel.cnf:/etc/mysql/conf.d/x-sentinel.cnf:ro
      - ./infra/mysql/init/10-monitoring-user.sh:/docker-entrypoint-initdb.d/10-monitoring-user.sh:ro
    networks:
      - data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    healthcheck:
      test:
        - CMD-SHELL
        - MYSQL_PWD="$${MYSQL_ROOT_PASSWORD}" mysqladmin ping --host=127.0.0.1 --user=root --silent
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    stop_grace_period: 60s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 1g
        reservations:
          memory: 384m

  redis:
    image: redis:7.4-alpine
    # Run directly as the redis user so container recreation does not rely
    # on a privileged entrypoint traversing the persistent AOF directory.
    user: "999:1000"
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:-change-me-redis}
      - --maxmemory
      - ${REDIS_MAXMEMORY:-384mb}
      - --maxmemory-policy
      - noeviction
      - --tcp-keepalive
      - "60"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-384mb}
      TZ: ${TZ:-Asia/Shanghai}
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
      # The Redis entrypoint scans and fixes ownership under /data before
      # dropping privileges to the redis user. Keep DAC override available
      # so this also works when an existing AOF directory is mode 700.
      - DAC_OVERRIDE
    healthcheck:
      test:
        - CMD-SHELL
        - redis-cli --no-auth-warning -a "$${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          memory: 128m

  migrate:
    <<: *backend-common
    command:
      - alembic
      - upgrade
      - head
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: "no"
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 384m

  backend:
    <<: *backend-common
    # Camoufox/Firefox uses shared memory heavily while loading and uploading.
    # Docker's 64 MB default can terminate the browser mid-navigation.
    shm_size: 512m
    tmpfs:
      - /tmp:size=256m,mode=1777
    volumes:
      - xhs_uploads:/var/lib/xsentinel/xhs-uploads
      - xhs_home:/var/lib/xsentinel/xhs-home
    command:
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --proxy-headers
    expose:
      - "8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/ready', timeout=3)"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g
        reservations:
          memory: 256m

  worker:
    <<: *backend-common
    command:
      - python
      - -m
      - app.worker
    expose:
      - "8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, redis, urllib.request; u=os.getenv('REDIS_URL'); c=redis.Redis.from_url(u, socket_timeout=3) if u else redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT']), db=int(os.getenv('REDIS_DB', '0')), password=os.getenv('REDIS_PASSWORD') or None, socket_timeout=3); c.ping(); urllib.request.urlopen('http://127.0.0.1:8001/metrics', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 768m
        reservations:
          memory: 192m

  ai-worker:
    <<: *backend-common
    command:
      - python
      - -m
      - app.ai_worker
    environment:
      <<: *backend-environment
    expose:
      - "8002"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, redis, urllib.request; u=os.getenv('REDIS_URL'); c=redis.Redis.from_url(u, socket_timeout=3) if u else redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT']), db=int(os.getenv('REDIS_DB', '0')), password=os.getenv('REDIS_PASSWORD') or None, socket_timeout=3); c.ping(); urllib.request.urlopen('http://127.0.0.1:8002/metrics', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 60s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
        reservations:
          memory: 128m


  qq-worker:
    <<: *backend-common
    command:
      - python
      - -m
      - app.qq_worker
    expose:
      - "8003"
      - "8004"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import os, redis, urllib.request; u=os.getenv('REDIS_URL'); c=redis.Redis.from_url(u, socket_timeout=3) if u else redis.Redis(host=os.environ['REDIS_HOST'], port=int(os.environ['REDIS_PORT']), db=int(os.getenv('REDIS_DB', '0')), password=os.getenv('REDIS_PASSWORD') or None, socket_timeout=3); assert c.get('xsentinel:qq-worker:heartbeat'); urllib.request.urlopen('http://127.0.0.1:8004/metrics', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    stop_grace_period: 45s
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 512m
        reservations:
          memory: 128m


  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    image: x-sentinel-frontend:${IMAGE_TAG:-latest}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_BIND_IP:-0.0.0.0}:${APP_PORT:-8080}:80"
    networks:
      - app
      - monitoring
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m,mode=0755
      - /var/run:size=2m,mode=0755
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD-SHELL
        - wget -q --spider http://127.0.0.1/healthz
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 128m
        reservations:
          memory: 32m

  mysql-exporter:
    image: prom/mysqld-exporter:v0.16.0
    profiles:
      - monitoring
    command:
      - --mysqld.address=mysql:3306
      - --mysqld.username=exporter
      - --collect.info_schema.innodb_metrics
      - --collect.info_schema.processlist
    environment:
      MYSQLD_EXPORTER_PASSWORD: ${MYSQL_EXPORTER_PASSWORD:-change-me-exporter}
    depends_on:
      mysql:
        condition: service_healthy
    expose:
      - "9104"
    networks:
      - data
      - monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  redis-exporter:
    image: oliver006/redis_exporter:v1.69.0
    profiles:
      - monitoring
    environment:
      REDIS_ADDR: redis://redis:6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-change-me-redis}
    depends_on:
      redis:
        condition: service_healthy
    expose:
      - "9121"
    networks:
      - data
      - monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles:
      - monitoring
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/rootfs
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|var/lib/containers/storage/.+)($$|/)
    expose:
      - "9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    networks:
      - monitoring
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128m

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles:
      - monitoring
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-15d}
      - --web.enable-lifecycle
    ports:
      - "${PROMETHEUS_BIND_IP:-127.0.0.1}:${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./infra/prometheus/rules:/etc/prometheus/rules:ro
      - prometheus_data:/prometheus
    networks:
      - monitoring
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - wget
        - --spider
        - --quiet
        - http://127.0.0.1:9090/-/healthy
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.00"
          memory: 1g
        reservations:
          memory: 256m

  grafana:
    image: grafana/grafana:12.1.0
    profiles:
      - monitoring
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3000}
      GF_LOG_MODE: console
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "${GRAFANA_BIND_IP:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - monitoring
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 30s
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512m
        reservations:
          memory: 128m

networks:
  app:
    driver: bridge
  data:
    driver: bridge
    internal: true
  monitoring:
    driver: bridge

volumes:
  xhs_uploads:
  xhs_home:
  mysql_data:
  redis_data:
  prometheus_data:
  grafana_data:
