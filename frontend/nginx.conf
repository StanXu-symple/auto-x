server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location = /metrics {
        access_log off;
        default_type text/plain;
        return 200 "# HELP x_sentinel_frontend_up Frontend Nginx is serving requests.\n# TYPE x_sentinel_frontend_up gauge\nx_sentinel_frontend_up 1\n";
    }

    # QQ signs these callbacks. The adapter verifies the signature and AppID;
    # no admin session is required. Resolve lazily so an offline worker does
    # not prevent the console itself from starting.
    location ~ ^/qq/webhook/?$ {
        resolver 127.0.0.11 valid=10s;
        set $qq_callback_backend qq-worker:8003;
        proxy_pass http://$qq_callback_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $api_backend backend:8000;
        proxy_pass http://$api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
